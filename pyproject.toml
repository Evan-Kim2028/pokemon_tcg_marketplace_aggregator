[project]
name = "pokemon_tcg_marketplace_aggregator"
version = "0.1.0"
description = "Pokemon TCG OTC listing aggregator for graded cards across web3 marketplaces"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx[http2]>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
# courtyard source requires an OpenSea API key (set OPENSEA_API_KEY env var)
courtyard = []
# dotenv support for loading keys from a local .env file
dotenv = ["python-dotenv>=1.0"]

[project.scripts]
pokemon_tcg_marketplace_aggregator = "marketplace_aggregator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketplace_aggregator"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
